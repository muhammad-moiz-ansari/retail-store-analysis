# RetailPulse CI (TEAM-CI, coordinated by Ruhab).
# fast:     every push/PR. Agents/events/database tests against a throwaway PostgreSQL service.
# frontend: every push/PR. Lint, typecheck, dashboard-provider tests and production build.
# cv-slow:  manual or weekly. CV interaction suite with the full backend requirements (CPU torch).
# Branch protection (required checks) must be switched on in GitHub settings by a repo admin.
name: ci

on:
  push:
    branches: [main, stage, fyp-2, 'fyp2-*', 'feature/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: backend fast (agents, events, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: retailpulse
          POSTGRES_PASSWORD: retailpulse
          POSTGRES_DB: retailpulse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U retailpulse" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://retailpulse:retailpulse@localhost:5432/retailpulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - run: pip install -r backend/requirements-ci.txt
      - name: pytest (fast)
        run: >-
          python -m pytest backend/agents backend/events/test_events.py backend/test_postgres_migration.py
          backend/test_handoff_eval.py -q -ra -p no:cacheprovider --basetemp "$RUNNER_TEMP/pytest"

  frontend:
    name: frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --project frontend/tsconfig.json --noEmit --incremental false
      - run: npm run test:dashboard-provider
      - run: npm run build

  cv-slow:
    name: CV interaction suite (slow)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r backend/requirements.txt pytest
      - name: pytest (CV)
        run: python -m pytest backend/interaction -q -ra -p no:cacheprovider --basetemp "$RUNNER_TEMP/pytest"

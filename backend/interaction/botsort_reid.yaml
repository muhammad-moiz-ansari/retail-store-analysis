# BoT-SORT with appearance ReID: stops an ID jumping to a differently dressed
# person when two people cross (plain ByteTrack matches on position only).
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True
model: auto # reuse the detector's own features as the appearance embedding
